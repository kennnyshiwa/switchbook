services:
  postgres:
    image: postgres:17-alpine
    container_name: switchbook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-switchbook}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-switchbook_password}
      POSTGRES_DB: ${DB_NAME:-switchbook}
      HYDRA_DB_USER: ${HYDRA_DB_USER:-switchbook_hydra}
      HYDRA_DB_PASSWORD: ${HYDRA_DB_PASSWORD:?HYDRA_DB_PASSWORD is required}
      HYDRA_DB_NAME: ${HYDRA_DB_NAME:-switchbook_hydra}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/init-hydra-db.sh:/docker-entrypoint-initdb.d/20-init-hydra-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-switchbook}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - switchbook-network

  app:
    # Use pre-built image from GitHub Container Registry
    image: ghcr.io/kennnyshiwa/switchbook:main
    container_name: switchbook-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      hydra:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - switchbook-network
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-switchbook}:${DB_PASSWORD:-switchbook_password}@postgres:5432/${DB_NAME:-switchbook}
      
      # NextAuth - IMPORTANT: Use HTTPS URL even though nginx uses HTTP
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://yourdomain.com}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      
      # Email (Mailgun)
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      MAILGUN_FROM: ${MAILGUN_FROM}
      MAILGUN_URL: ${MAILGUN_URL:-https://api.mailgun.net}
      MAILGUN_MAILING_LIST: ${MAILGUN_MAILING_LIST}
      
      # OAuth
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PARTNER_OIDC_ISSUER: ${PARTNER_OIDC_ISSUER:-https://switchbook.app}
      PARTNER_OIDC_AUDIENCE: ${PARTNER_OIDC_AUDIENCE:-https://switchbook.app/api/v1}
      PARTNER_SECRET_ENCRYPTION_KEY: ${PARTNER_SECRET_ENCRYPTION_KEY:?PARTNER_SECRET_ENCRYPTION_KEY is required}
      HYDRA_ADMIN_URL: http://hydra:4445

      # Node
      NODE_ENV: production
      # Force HTTPS URLs
      NEXT_PUBLIC_BASE_URL: https://switchbook.app
    volumes:
      # Persist uploaded images
      - uploads:/app/public/uploads
    command: >
      sh -c "
        npx prisma migrate deploy &&
        node server.js
      "

  hydra:
    image: oryd/hydra:v2.3.0
    container_name: switchbook-hydra
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/ash
    command:
      - -c
      - /usr/bin/hydra migrate sql --yes "$${HYDRA_DSN}" && exec /usr/bin/hydra serve all --config /etc/hydra/hydra.yml
    environment:
      DSN: postgres://${HYDRA_DB_USER:-switchbook_hydra}:${HYDRA_DB_PASSWORD:?HYDRA_DB_PASSWORD is required}@postgres:5432/${HYDRA_DB_NAME:-switchbook_hydra}?sslmode=disable
      HYDRA_DSN: postgres://${HYDRA_DB_USER:-switchbook_hydra}:${HYDRA_DB_PASSWORD:?HYDRA_DB_PASSWORD is required}@postgres:5432/${HYDRA_DB_NAME:-switchbook_hydra}?sslmode=disable
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET:?HYDRA_SYSTEM_SECRET is required}
    volumes:
      - ./ops/hydra/hydra.yml:/etc/hydra/hydra.yml:ro
    networks:
      - switchbook-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4445/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    container_name: switchbook-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks:
      - switchbook-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: switchbook-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - uploads:/app/public/uploads:ro
    networks:
      - switchbook-network

networks:
  switchbook-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads:
