services:
  postgres:
    image: postgres:17-alpine
    container_name: switchbook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-switchbook}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-switchbook_password}
      POSTGRES_DB: ${DB_NAME:-switchbook}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-switchbook}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - switchbook-network

  app:
    # Use pre-built image from GitHub Container Registry
    image: ghcr.io/kennnyshiwa/switchbook:main
    container_name: switchbook-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      hydra:
        condition: service_healthy
    networks:
      - switchbook-network
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-switchbook}:${DB_PASSWORD:-switchbook_password}@postgres:5432/${DB_NAME:-switchbook}
      
      # NextAuth - IMPORTANT: Use HTTPS URL even though nginx uses HTTP
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://yourdomain.com}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      
      # Email (Mailgun)
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN}
      MAILGUN_FROM: ${MAILGUN_FROM}
      MAILGUN_URL: ${MAILGUN_URL:-https://api.mailgun.net}
      MAILGUN_MAILING_LIST: ${MAILGUN_MAILING_LIST}
      
      # OAuth
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      REDIS_URL: ${REDIS_URL:-}
      PARTNER_OIDC_ISSUER: ${PARTNER_OIDC_ISSUER:-https://switchbook.app}
      PARTNER_OIDC_AUDIENCE: ${PARTNER_OIDC_AUDIENCE:-https://switchbook.app/api/v1}
      HYDRA_ADMIN_URL: http://hydra:4445

      # Node
      NODE_ENV: production
      # Force HTTPS URLs
      NEXT_PUBLIC_BASE_URL: https://switchbook.app
    volumes:
      # Persist uploaded images
      - uploads:/app/public/uploads
    command: >
      sh -c "
        npx prisma migrate deploy &&
        node server.js
      "

  hydra:
    image: oryd/hydra:v2.3.0
    container_name: switchbook-hydra
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/ash
    command:
      - -c
      - /usr/bin/hydra migrate sql --yes "$${HYDRA_DSN}" && exec /usr/bin/hydra serve all --config /etc/hydra/hydra.yml
    environment:
      DSN: ${HYDRA_DSN}
      HYDRA_DSN: ${HYDRA_DSN:?HYDRA_DSN is required}
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET:?HYDRA_SYSTEM_SECRET is required}
    volumes:
      - ./ops/hydra/hydra.yml:/etc/hydra/hydra.yml:ro
    networks:
      - switchbook-network
    healthcheck:
      test: ["CMD", "hydra", "health", "ready", "-e", "http://127.0.0.1:4445"]
      interval: 10s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:alpine
    container_name: switchbook-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - uploads:/app/public/uploads:ro
    networks:
      - switchbook-network

networks:
  switchbook-network:
    driver: bridge

volumes:
  postgres_data:
  uploads:
