serve:
  cookies:
    same_site_mode: Lax
urls:
  self:
    issuer: https://switchbook.app
  login: https://switchbook.app/api/oauth/login
  consent: https://switchbook.app/api/oauth/consent
  logout: https://switchbook.app/auth/logout
strategies:
  access_token: jwt
oauth2:
  expose_internal_errors: false
  pkce:
    enforced: true
    enforced_for_public_clients: true
  allowed_top_level_claims:
    - username
    - email
oidc:
  subject_identifiers:
    supported_types:
      - public
webfinger:
  jwks:
    broadcast_keys:
      - hydra.openid.id-token
      - hydra.jwt.access-token
  oidc_discovery:
    supported_claims:
      - email
      - username
    supported_scope:
      - profile:read
      - submissions:write
      - submissions:read
      - corrections:write
ttl:
  access_token: 15m
  refresh_token: 720h
  id_token: 15m
log:
  level: info
  format: json
