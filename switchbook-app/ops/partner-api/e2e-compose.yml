services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: partner_e2e
      POSTGRES_PASSWORD: ${PARTNER_E2E_DB_PASSWORD:?PARTNER_E2E_DB_PASSWORD is required}
      POSTGRES_DB: partner_e2e
    tmpfs: [/var/lib/postgresql/data]
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partner_e2e"]
      interval: 2s
      timeout: 2s
      retries: 20
